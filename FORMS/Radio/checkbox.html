<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckBox</title>
</head>
<body>
    <!-- here in checkbox you can define multiple values 
     inside one tree that is you can select multiple values-->
     <!-- value will send what exact value need to be
      inputed after u use the value function-->
    <form>
               <label for="c">C</label>
        <input type= "checkbox" name="lang" id="c" value ="c"> <br>
                <label for="java">JAVA </label>
        <input type= "checkbox" name="lang" id="java"> <br>
                <label for="phython">PYTHON</label>
        <input type= "checkbox" name="lang" id="phython"> <br>
        
    </form>

</body>
</html>
